<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17324d"><title>شركة الفرقان | الحضور والانصراف</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font-family:Tahoma,Arial,sans-serif;color:#182433;min-height:100vh;display:grid;place-items:center;padding:18px}
.card{background:#fff;width:min(100%,480px);padding:24px;border-radius:18px;box-shadow:0 12px 36px #102a4315}h1{margin:0 0 8px;color:#17324d;font-size:25px}p{line-height:1.7;color:#526173}.sub{margin-top:0}
label{display:block;font-weight:bold;margin:16px 0 7px}input,select,button{width:100%;padding:13px;border:1px solid #ccd5df;border-radius:10px;font:inherit}button{border:0;background:#176b4d;color:#fff;font-weight:bold;cursor:pointer;margin-top:16px;transition:.2s}button.secondary{background:#17324d}button:disabled{opacity:.9;background:#111 !important;color:#fff;cursor:not-allowed}button.done{opacity:.9;background:#111 !important} .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{margin-top:14px}.notice{padding:12px;border-radius:10px;background:#f4f7fa;margin-top:16px;white-space:pre-wrap;line-height:1.7}.ok{background:#e7f8ee;color:#11643b}.bad{background:#fff0ef;color:#a3261d}.small{font-size:12px;color:#64748b}
</style></head><body><main class="card"><img src="logo.png" style="width:110px; display:block; margin:0 auto 16px;"><h1>شركة الفرقان</h1><p class="sub">نظام تسجيل الحضور والانصراف</p>
<label for="code">كود الموظف</label><input id="code" autocomplete="username" maxlength="40" placeholder="اكتب كود الموظف">
<label for="pin">الرقم السري للموظف</label><input id="pin" type="password" autocomplete="current-password" maxlength="100" placeholder="اكتب الرقم السري">
<label for="branch">الفرع</label><select id="branch"><option value="">جارٍ تحميل الفروع...</option></select>
<div class="actions"><button id="in" onclick="submitAttendance('حضور')">تسجيل حضور</button><button id="out" class="secondary" onclick="submitAttendance('انصراف')">تسجيل انصراف</button></div>
<div id="message" class="notice" role="status">اختر الفرع واسمح للموقع بالوصول إلى GPS عند التسجيل.</div>
<p class="small">لن تظهر لك سجلات الموظفين الآخرين. للإدارة صفحة منفصلة ومحمية.</p></main>
<script>
const $=id=>document.getElementById(id);
const todayKey = ()=> new Date().toISOString().slice(0,10);

function getStoredStatus(){
  const code = $('code').value.trim();
  if(!code) return {in:false,out:false};
  const raw = localStorage.getItem(`att_${code}_${todayKey()}`);
  try{return raw? JSON.parse(raw) : {in:false,out:false}}catch{return {in:false,out:false}}
}
function setStoredStatus(inDone,outDone){
  const code = $('code').value.trim();
  if(!code) return;
  const cur = getStoredStatus();
  const next = {in: inDone || cur.in, out: outDone || cur.out};
  localStorage.setItem(`att_${code}_${todayKey()}`, JSON.stringify(next));
  applyButtonsState();
}
function applyButtonsState(){
  const s = getStoredStatus();
  if(s.in){
    $('in').disabled = true;
    $('in').textContent = 'تم تسجيل الحضور ✓';
    $('in').classList.add('done');
  } else {
    $('in').disabled = false;
    $('in').textContent = 'تسجيل حضور';
    $('in').classList.remove('done');
  }
  if(s.out){
    $('out').disabled = true;
    $('out').textContent = 'تم تسجيل الانصراف ✓';
    $('out').classList.add('done');
  } else {
    $('out').disabled = false;
    $('out').textContent = 'تسجيل انصراف';
    $('out').classList.remove('done');
  }
}

async function loadBranches(){try{const r=await fetch('/api/branches');const data=await r.json();$('branch').innerHTML='<option value="">اختر الفرع</option>'+data.map(b=>`<option value="${b.id}" ${!b.configured?'disabled':''}>${escapeHtml(b.name)}${!b.configured?' — غير مجهز':''}</option>`).join('')}catch(e){$('branch').innerHTML='<option value="">تعذر تحميل الفروع</option>'}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(msg,ok){$('message').textContent=msg;$('message').className='notice '+(ok?'ok':'bad')}
function getLocation(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(new Error('المتصفح لا يدعم تحديد الموقع.'));navigator.geolocation.getCurrentPosition(p=>resolve({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy}),e=>reject(new Error(e.code===1?'اسمح للموقع بالوصول إلى GPS.':'تعذر تحديد موقعك. فعّل GPS وحاول مرة أخرى.')),{enableHighAccuracy:true,timeout:20000,maximumAge:0})})}
async function submitAttendance(action){
  const code=$('code').value.trim(),pin=$('pin').value,branchId=$('branch').value;
  if(!code||!pin||!branchId)return show('اكتب كود الموظف والرقم السري واختر فرعًا مجهزًا.',false);
  
  const st = getStoredStatus();
  if(action==='حضور' && st.in) return show('انت سجلت حضور اليوم خلاص ✓', true);
  if(action==='انصراف' && st.out) return show('انت سجلت انصراف اليوم خلاص ✓', true);

  $('in').disabled=$('out').disabled=true;show('جارٍ تحديد الموقع والتحقق من التسجيل...',true);
  try{
    const loc=await getLocation();
    const r=await fetch('/api/attendance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,pin,branchId:Number(branchId),action,...loc})});
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||'تعذر التسجيل.');
    show(`${data.message}\nالفرع: ${data.branch}\nالوقت: ${data.time}`,true);
    if(action==='حضور') setStoredStatus(true,false);
    else setStoredStatus(false,true);
    $('pin').value='';
  }catch(e){show(e.message||'حدث خطأ.',false); applyButtonsState();}
}

$('code').addEventListener('input', applyButtonsState);
$('code').addEventListener('change', applyButtonsState);
loadBranches();
applyButtonsState();
</script></body></html>
